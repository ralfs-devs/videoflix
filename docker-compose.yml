services:
  db:
    image: postgres:latest
    container_name: videoflix_database
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql


  redis:
    image: redis:latest
    container_name: videoflix_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
      dockerfile: backend.Dockerfile
    env_file: .env
    container_name: videoflix_backend

    volumes:
      - .:/app
      - videoflix_media:/app/media
      - videoflix_static:/app/static
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
      - redis

  worker:
    build: 
      context: .
      dockerfile: backend.Dockerfile
    command: python manage.py rqworker default
    env_file: .env
    environment:
      - PYTHONBUFFERED=1
      - SKIP_MIGRATIONS=true
    deploy:
      replicas: 3
    depends_on:
      - redis
      - db



volumes:
  postgres_data:
  redis_data:
  videoflix_media:
  videoflix_static:
